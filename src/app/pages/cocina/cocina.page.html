@if(loading) {
  <app-loading/>
} @else {
  <header>
    <img src="assets/icon/cubiertos.png">
    <title>Cocina</title>
    <img src="assets/icon/cubiertos.png">
  </header>

  <ion-content class="ion-padding">
    <ion-refresher slot="fixed" (ionRefresh)="cargar(); $event.target.complete()">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <ng-container *ngIf="pedidos.length; else empty">
      <div class="div_container">
        <div class="div_pedidos" *ngFor="let p of pedidos">
          <div class="div_data_pedido">
            <p class="p_mesa">Mesa {{ p.mesa_numero }}</p>
            <p>Hora: {{ formatearHora(p.creado_en) }}</p>
            
            <div class="items-container">
              <div class="item" *ngFor="let it of p.items">
                <span class="item-nombre">🍽️{{ it.nombre }}</span>
                <span class="item-cantidad">x{{ it.cantidad }}</span>
              </div>
            </div>

            <div class="pedido-meta">
              <span class="meta-total">{{ p.total | currency:'ARS':'symbol':'1.2-2' }}</span>
            </div>

            <div class="estado-pedido">
              🕓PENDIENTE🕓
            </div>
          </div>

          <div class="div_btn">
            <button class="btn_terminar" (click)="terminar(p.id)">Terminar</button>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-template #empty>
      <div class="vacio">
        No hay pedidos pendientes en cocina
      </div>
      <div class="div_img">
        <img src="assets/images/cocina.jpg" alt="Cocina">
      </div>
    </ng-template>
  </ion-content>

  <footer>
    <hr>
    <button class="btn_footer" routerLink="/home">
      Volver
    </button>
    <hr>
  </footer>
}

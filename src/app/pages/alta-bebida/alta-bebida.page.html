@if(loading) {
  <app-loading/>
} @else {
  <header>
    <img src="assets/icon/cubiertos.png">
    <title>Alta Bebida</title>
    <img src="assets/icon/cubiertos.png">
  </header>

  <ion-content class="ion-padding">
    <form [formGroup]="formAltaBebida" novalidate>
      <ion-item lines="none" class="input-field">
        <ion-input 
          class="input"
          placeholder="Nombre"
          formControlName="nombre"
          autocomplete="off">
        </ion-input>
      </ion-item>
      <app-form-errors *ngIf="f.nombre.touched && f.nombre.invalid" [control]="f.nombre"></app-form-errors>

      <ion-item lines="none" class="ion-item-text-area">
        <ion-textarea 
          placeholder="Descripción" 
          formControlName="descripcion" 
          autoGrow="true"
          autocomplete="off">
        </ion-textarea>
      </ion-item>
      <app-form-errors *ngIf="f.descripcion.touched && f.descripcion.invalid" [control]="f.descripcion"></app-form-errors>

      <ion-item lines="none" class="input-field">
        <ion-input 
          class="input"
          type="number" 
          inputmode="numeric"
          placeholder="Tiempo (minutos)" 
          formControlName="tiempo_elaboracion_min"
          autocomplete="off">
        </ion-input>
      </ion-item>
      <app-form-errors *ngIf="f.tiempo_elaboracion_min.touched && f.tiempo_elaboracion_min.invalid" [control]="f.tiempo_elaboracion_min"></app-form-errors>

      <ion-item lines="none" class="input-field">
        <ion-input 
          class="input"
          type="number" 
          inputmode="decimal"
          placeholder="Precio" 
          formControlName="precio"
          autocomplete="off">
        </ion-input>
      </ion-item>
      <app-form-errors *ngIf="f.precio.touched && f.precio.invalid" [control]="f.precio"></app-form-errors>

      <div class="fotos">
          @for (c of fotosFA.controls; track $index; let i = $index) {
            <div class="each">
              <div class="slot">
                <img [src]="c.value || placeholderUrl" alt="foto {{ i + 1 }}"> 
              </div>
              <div class="span" type="button" (click)="eliminarFoto(i)">
                <span>Eliminar</span>
              </div>
            </div>
          }
      </div>

      @if(faltanFotos > 0) { 
        <div class="error">
          <span class="fotos-hint">Faltan {{ faltanFotos }} foto(s) <br> Se necesitan 3 fotos</span>
        </div>
      }

      <ion-button class="btn-secondary" type="button" (click)="elegirFotos()">Tomar Fotos</ion-button>

      <ion-button class="btn-primary" [disabled]="formAltaBebida.invalid" (click)="enviar()">
        Guardar
      </ion-button>

      <ion-button class="btn-tertiary" href="/home">
        Volver
      </ion-button>
      </form>
  </ion-content>
}

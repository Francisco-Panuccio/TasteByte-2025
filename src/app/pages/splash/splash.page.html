
<ion-content [fullscreen]="true" class="splash-container">

    <div class="logo-container">
      <img src="./assets/icon/logo.png" class="logo" alt="Logo Restaurante">
    </div>

    <h1 class="titulo">TasteByte</h1>

    <div class="integrantes">
      <h3>Integrantes:</h3>
      <ion-list lines="none">
        <ion-item>
          <ion-avatar slot="start">
            <img src="assets/integrantes/logo.png">
          </ion-avatar>
          <ion-label>Roman Tomas</ion-label>
        </ion-item>
        <ion-item>
          <ion-avatar slot="start">
            <img src="assets/integrantes/logo.png">
          </ion-avatar>
          <ion-label>Panuccio Fransisco</ion-label>
        </ion-item>
        <ion-item>
          <ion-avatar slot="start">
            <img src="assets/integrantes/logo.png">
          </ion-avatar>
          <ion-label>Avallone Joaquin</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>

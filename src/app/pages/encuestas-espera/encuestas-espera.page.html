<ion-header>
  <ion-toolbar>
    <ion-title>Bienvenido {{ nombreCliente }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" color="primary" (click)="escanearQr()">
    Escanear QR de Ingreso
  </ion-button>

  <div *ngIf="tienePermiso">
    <ion-card>
      <ion-card-header>
        Opciones disponibles
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" routerLink="/lista-espera" [queryParams]="{ anonimoId: anonimoId, userId: usuarioId }" color="tertiary">
          Ver Lista de Espera
        </ion-button>

        <ion-button expand="block" color="medium" [disabled]="yaRegistrado" (click)="registrarseListaEspera()">
          Unirse a la Lista de Espera
        </ion-button>

        <div class="encuestas">
          <h2>Encuestas de Clientes</h2>
          <ion-card *ngFor="let encuesta of encuestas">
            <ion-card-header>{{ encuesta.titulo }}</ion-card-header>
            <ion-card-content>
              {{ encuesta.descripcion }}
              <ion-button size="small" (click)="registrarEncuesta(encuesta.id)">
                Participar
              </ion-button>
            </ion-card-content>
          </ion-card>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

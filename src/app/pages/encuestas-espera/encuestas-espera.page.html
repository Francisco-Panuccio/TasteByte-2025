
<ion-header>
  <ion-toolbar>
    <ion-title>QR de Ingreso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="qrValue">
    <qrcode [qrdata]="qrValue" [width]="250"></qrcode>
    <p class="ion-text-center">Escanee este código al ingresar al restaurante</p>
  </div>
</ion-content>

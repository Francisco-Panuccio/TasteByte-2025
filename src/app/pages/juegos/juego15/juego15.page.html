<header>
  <ion-toolbar color="dark">
    <ion-title>Mayor o Menor</ion-title>
  </ion-toolbar>
</header>

<ion-content class="ion-padding user_background">
  <div class="div_main">
    <h2>¿La siguiente carta será mayor o menor?</h2>

    <div class="carta">
      <img [src]="urlCarta" alt="Carta" class="img_carta" />
    </div>

    <div *ngIf="play && !juegoFinalizado" class="progreso">
      <p>Aciertos seguidos: <strong>{{ racha }}/4</strong></p>
    </div>

    <div *ngIf="!play">
      <ion-button expand="block" color="success" (click)="iniciarJuego()">
        Empezar
      </ion-button>
    </div>

    <div *ngIf="play && !juegoFinalizado" class="acciones">
      <ion-button expand="block" color="success" (click)="elegir('mayor')">
        Mayor
      </ion-button>
      <ion-button expand="block" color="warning" (click)="elegir('menor')">
        Menor
      </ion-button>
    </div>

    <div *ngIf="juegoFinalizado" class="resultado">
      <p *ngIf="gano">🎉 ¡Ganaste! Lograste los 4 aciertos seguidos.</p>
      <p *ngIf="!gano">❌ Perdiste. Intenta de nuevo.</p>
      <ion-button expand="block" color="primary" (click)="resetear()">
        Volver a Jugar
      </ion-button>
    </div>
  </div>
  
  <footer>
    <ion-toolbar>
      <ion-buttons class="ion_btns">
        <ion-button class="btn_logged" (click)="volver()">Volver</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </footer>
</ion-content>
